<style>
/* ===== ธีม (กลางวัน / กลางคืน) ===== */
:root{color-scheme:light;--bg:#fff7fb;--panel:#fffffff0;--item:#fff3f8;--soft:#f8e8f2;--soft2:#f1d3e5;--tx:#49364a;--mut:#7d647d;--line:#f2d9e8;
 --btn:linear-gradient(135deg,#f7afd0,#e8b9ff);--btn2:linear-gradient(135deg,#ffc7df,#edcfff);--btntx:#57364f;--sel:linear-gradient(135deg,#f7b8d5,#e6d2ff);
 --inp:#fff;--h:#6e4b70;--acc:#a34f86;--g1:#ffe4f1;--g2:#e9e5ff;--sh:#bd83a51c;--err:#c2415b;--ok:#2e7d4f;--r:22px}
:root[data-theme=dark]{color-scheme:dark;--bg:#121212;--panel:#1a1a1aed;--item:#222;--soft:#2c2c2c;--soft2:#383838;--tx:#ececec;--mut:#a8a8a8;--line:#303030;
 --btn:linear-gradient(135deg,#dadadd,#bcbcc0);--btn2:linear-gradient(135deg,#e7e7e9,#cbcbcf);--btntx:#1c1c1c;--sel:linear-gradient(135deg,#dadadd,#bcbcc0);
 --inp:#131313;--h:#ededed;--acc:#d0d0d0;--g1:#2a2a2a;--g2:#212121;--sh:#0006;--err:#ff9a8a;--ok:#a5e6a5}

/* ===== พื้นฐาน ===== */
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 10% 0,var(--g1),transparent 38%),radial-gradient(ellipse at 100% 20%,var(--g2),transparent 34%),var(--bg);color:var(--tx);font:400 15px/1.6 Prompt,system-ui,sans-serif;min-height:100vh;padding:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:1180px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px var(--sh);padding:26px}
.mut,.nmeta,.foot,.cat,header small{color:var(--mut)}

/* ===== หัวเว็บ ===== */
header{display:flex;align-items:center;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.mark{width:52px;height:52px;border-radius:18px}
header h1{font-size:19px;font-weight:600;line-height:1.2;letter-spacing:.2px}
header small{font-size:13px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px}
.tbtn{background:none;border:0;border-radius:99px;min-width:42px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:600}
.tbtn:hover{background:var(--soft2)}.seg .tbtn[aria-pressed=true]{background:var(--btn);color:var(--btntx)}
#theme{background:var(--soft);border:1px solid var(--line);font-size:17px;padding:0;width:42px;min-height:42px;line-height:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who img{width:34px;height:34px;border-radius:50%}
.who-btn{background:none;border:0;display:flex;align-items:center;gap:10px;border-radius:99px;padding:2px 10px 2px 2px}.who-btn:hover{background:var(--soft)}
.lk{background:none;border:0;color:var(--mut)}

/* ===== ปุ่ม ===== */
.btn,.side button{position:relative;overflow:hidden;transition:transform .15s,background .2s}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 20px;font-weight:600;text-decoration:none;background:var(--btn);color:var(--btntx);box-shadow:0 5px 14px var(--sh)}
.btn:hover{background:var(--btn2);transform:translateY(-1px)}.btn:active,.side button:active{transform:scale(.94)}
.btn.soft{background:var(--soft);color:var(--tx);box-shadow:none}.btn.soft:hover{background:var(--soft2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* ===== โครงหน้า + เมนูข้าง ===== */
main{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;margin-top:22px}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--item);border:1px solid var(--line);border-radius:var(--r)}
.side button{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:11px 14px;text-align:left;background:var(--panel)}
.side button:hover{background:var(--soft);transform:translateX(-3px)}
.side button[aria-selected=true]{background:var(--sel);color:var(--btntx);font-weight:600;box-shadow:0 5px 12px var(--sh)}

/* ===== เนื้อหา ===== */
.cat{font-size:13px}
h2{font-size:clamp(25px,4vw,34px);font-weight:600;margin:4px 0 6px;color:var(--h)}
.lead{color:var(--mut);line-height:1.8;margin-bottom:22px;max-width:56ch}
.card{background:var(--item);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 8px 24px var(--sh);transition:transform .18s}
a.card{color:inherit;text-decoration:none}
.card h3{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.grid.news{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid .card{margin:0;display:flex;flex-direction:column;gap:8px}.grid .card:hover{transform:translateY(-3px)}
.news .btn{align-self:flex-start}
.nmeta{font-size:13px}
.nbody{font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere;flex:1}
.pimg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.plogo{object-fit:contain;background:var(--inp)}
.lcard .pimg,.lcard .nbody{display:block;margin-bottom:14px}
.empty{color:var(--mut);text-align:center;border:1px dashed var(--line);border-radius:var(--r);padding:30px}
.foot{font-size:12px;margin-top:20px;padding-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{background:var(--soft);border:0;border-radius:99px;padding:8px 16px}.chip.on{background:var(--btn);color:var(--btntx)}

/* ===== การ์ดพาร์ตเนอร์ ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 20px 20px;margin:0}
.pcard:hover{transform:translateY(-3px)}
.badges{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.badge{font-size:11px;font-weight:600;letter-spacing:.4px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--acc)}
.badge.aff{color:var(--ok)}
.plogo2{height:72px;max-width:100%;object-fit:contain;border-radius:14px}
.pq{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:600;background:var(--soft2);color:var(--mut)}
.pcard hr{align-self:stretch;border:0;border-top:1px solid var(--line);margin:18px 0 14px}
.pcard h3{font-size:16px}.pcard p{font-size:13px;color:var(--mut);margin-top:2px}

/* ===== โปรไฟล์ + ไอคอนแอพ ===== */
.phead{display:flex;align-items:center;gap:16px}
.pav{width:72px;height:72px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--line)}
.pwho{min-width:0;flex:1}.pwho .nmeta{margin-top:2px}
code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.sico{width:24px;height:24px;border-radius:6px;flex:none;object-fit:contain;background:#fff}
.sfb{display:inline-grid;place-items:center;font-size:15px;background:var(--soft)}
.pfav .sico{width:40px;height:40px;border-radius:10px}

/* ===== ฟอร์ม + หลังบ้าน ===== */
label{display:block;font-size:14px;color:var(--mut);margin:16px 0 6px}
input,select,textarea{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
::placeholder{color:var(--mut);opacity:.75}
textarea{height:120px;font-size:14.5px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px}
.msg{font-size:14px;margin-top:12px;min-height:20px}.err{color:var(--err)}.ok{color:var(--ok)}
.f{display:flex;gap:8px;align-items:center}.f>*{min-width:0}
dialog{margin:auto;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:26px;width:min(900px,96vw);max-height:90dvh;box-shadow:0 24px 90px #0006}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#2d1a2c88;backdrop-filter:blur(4px)}
dialog h3{font-size:22px;color:var(--h)}
.ad{flex:1;min-height:0;overflow:auto;padding:2px 5px}.ad h4{margin:22px 0 10px;color:var(--acc);font-size:16px}
.ar{background:var(--item);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;gap:8px}
.ar textarea{height:90px}.col{flex:1;display:grid;gap:8px}
.thumb{width:84px;height:60px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
.emo{flex:0 0 64px}.dt{flex:0 0 150px}

/* ===== แอนิเมชัน ===== */
.enter{animation:enter .4s ease both}@keyframes enter{from{opacity:0;transform:translateX(-18px)}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}}
.rip{position:absolute;border-radius:50%;background:#ffffff8c;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(1);opacity:0}}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:18px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) rotate(var(--br)) scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.enter,.pop,.burst{animation:none}.rip{display:none}}

/* ===== มือถือ ===== */
@media(max-width:760px){
 body{padding:8px}.app{padding:14px;border-radius:22px}.card{padding:16px}
 main{grid-template-columns:1fr;gap:14px}
 .side{order:-1;position:static;flex-direction:row;overflow-x:auto;padding:7px}.side button{white-space:nowrap;padding:10px 12px}
 header{flex-wrap:wrap}.who{width:100%}
}
@media(max-width:560px){dialog{padding:16px}.ad .f{flex-wrap:wrap}.row .btn{flex:1}}
</style>

let user, token, exp, isOwner, P, SP;      // user = บัญชี Discord, P = โปรไฟล์ที่กำลังแก้, SP = โปรไฟล์ที่บันทึกแล้ว
const dname = () => user.global_name || user.username;

function avatar(size){
  const ok = /^\d{5,25}$/.test(user.id);
  if(ok && /^(a_)?[a-f0-9]{16,40}$/i.test(user.avatar||"")) return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=${size}`;
  return `https://cdn.discordapp.com/embed/avatars/${ok ? Number((BigInt(user.id)>>22n)%6n) : 0}.png`;
}
function renderUser(){
  $("user").innerHTML = user
    ? `<button class="who-btn" data-go="profile" title="${esc(tr("profile"))}"><img alt="" src="${esc(avatar(64))}"><span>${esc(dname())}</span></button>${isOwner?`<button class="btn soft" data-act="admin">${tr("admin")}</button>`:""}<button class="lk" data-act="logout">${tr("logout")}</button>`
    : `<button class="btn" data-act="login">${tr("login")}</button>`;
}
function login(){
  const st = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now(); put("dstate",st);
  location.href = "https://discord.com/oauth2/authorize?response_type=token&scope=identify%20guilds&client_id=" + encodeURIComponent(CFG.clientId)
    + "&redirect_uri=" + encodeURIComponent(CFG.redirect) + "&state=" + encodeURIComponent(st);
}
async function fetchUser(){
  const H = {headers:{Authorization:"Bearer "+token}};
  try{
    const r = await fetch("https://discord.com/api/users/@me",H); if(!r.ok) throw r.status;
    user = await r.json(); save("dauth",JSON.stringify({t:token,e:exp})); P = loadProfile();
    SP = structuredClone(P);
    try{ const g = await fetch("https://discord.com/api/users/@me/guilds",H); isOwner = g.ok && (await g.json()).some(x => x.id==CFG.ownerGuild && x.owner===true); }catch{ isOwner = false; }
  }catch(e){ if(e===401) logout(true); }   // ออฟไลน์ไม่ล้างล็อกอิน
  renderUser(); go(curTab());
}
function logout(silent){ isOwner = false; user = token = P = SP = null; try{ localStorage.removeItem("dauth") }catch{} if(!silent){ renderUser(); go(curTab()); } }

function applyCfg(c){                      // รับ config.json → ตรวจ/ล้างค่า → ใส่ใน S
  if(!c || typeof c != "object") return;
  const L = (a,n,f) => Array.isArray(a) ? a.slice(0,n).map(f) : null;
  const news = L(c.news,50,(n,i) => ({id:clean(n.id)||"n"+i, title:clean(n.title), titleEn:clean(n.titleEn), date:/^\d{4}-\d{2}-\d{2}$/.test(n.date)?n.date:"", cat:clean(n.cat), body:body(n.body), bodyEn:body(n.bodyEn), img:img(n.img), link:url(n.link)}));
  const cats = L(c.cats,20,(x,i) => ({id:clean(x.id)||"c"+i, name:clean(x.name), nameEn:clean(x.nameEn), emoji:clean(x.emoji)}));
  const part = L(c.partners,30,p => ({name:clean(p.name), url:url(p.url), img:img(p.img), desc:clean(p.desc,80), descEn:clean(p.descEn,80), partner:p.partner!==false, affiliate:!!p.affiliate}));
  if(news) S.news = news; if(cats) S.cats = cats; if(part) S.partners = part;
  if("launcher" in c)     S.launcher = url(c.launcher);
  if("launcherImg" in c)  S.launcherImg = img(c.launcherImg);
  if("launcherText" in c) S.launcherText = body(c.launcherText);
  if("launcherTextEn" in c) S.launcherTextEn = body(c.launcherTextEn);
  if(c.invite) S.invite = url(c.invite) || S.invite;
  if(c.updated) S.updated = +c.updated || 0;
}

const fld = (p,ph,o={}) => { const v = String(at(p) ?? ""), a = `data-p="${p}" placeholder="${esc(ph)}" class="${o.cls||""}"`;
  return o.tag ? `<textarea ${a}>${esc(v)}</textarea>` : `<input ${a} type="${o.type||"text"}" value="${esc(v.startsWith("data:") ? "" : v)}">`; };
const btn = (a,t,p,i="") => `<button class="btn soft sm" data-a="${a}" data-p="${p}" data-i="${i}">${t}</button>`;
const chk = (p,t) => `<label class="f" style="margin:0"><input type="checkbox" data-p="${p}"${at(p)?" checked":""} style="width:auto"> ${t}</label>`;
const imgRow = (p,extra="",tail="") => `<div class="f"><img class="thumb" alt="" src="${esc(at(p))||"data:,"}"><div class="col">${extra}${fld(p,"ลิงก์รูป https://... หรือกดอัปโหลด")}</div></div>

$("ad").oninput = e => {                  // พิมพ์ → เขียนลง D ตาม data-p
  const t = e.target, p = t.dataset.p;
  if(t.dataset.pub){ const c = PUB(); c[t.dataset.pub] = t.value.trim(); save("dpub",JSON.stringify(c)); return; }
  if(!p) return;
  setP(p, t.type=="checkbox" ? t.checked : t.value);
  if(/img$/i.test(p)){ const m = t.closest(".ar").querySelector(".thumb"); if(m) m.src = t.value || "data:,"; }

$("ad").onclick = e => {                  // ปุ่ม เพิ่ม / ลบ / เลื่อน / ลบรูป
  const b = e.target.closest("[data-a]"); if(!b) return;
  const {a,p} = b.dataset, i = +b.dataset.i;
  if(a=="clr") setP(p,"");
  else{
    const L = D[p];
    if(a=="add") p=="news" ? L.unshift(NEW[p]()) : L.push(NEW[p]());
    if(a=="del"){ if(p=="news" && !confirm("ลบข่าวนี้?")) return; if(p=="cats") D.news.forEach(n => { if(n.cat==L[i].id) n.cat=""; }); L.splice(i,1); }
    const j = a=="up" ? i-1 : a=="dn" ? i+1 : -1;
    if(j>=0 && j<L.length) [L[i],L[j]] = [L[j],L[i]];
  }
  adRender();
};
$("ad").onchange = e => {                 // อัปโหลดรูป → ย่อขนาดแล้วเก็บเป็น data URI
  const f = e.target.files?.[0], p = e.target.dataset.up; if(!f || !p) return;
  const png = p.startsWith("partners"), max = p=="launcherImg" ? 640 : png ? 256 : 480, im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(im.src);
    const s = Math.min(1, max/(im.width||max)), c = document.createElement("canvas"), g = c.getContext("2d");
    c.width = Math.max(1, im.width*s|0); c.height = Math.max(1, im.height*s|0);
    if(!png){ g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); }
    g.drawImage(im,0,0,c.width,c.height);
    setP(p, c.toDataURL(png ? "image/png" : "image/jpeg", .8)); adRender();
  };
  im.onerror = () => URL.revokeObjectURL(im.src); im.src = URL.createObjectURL(f);
};

const PUB = () => { try{ return JSON.parse(localStorage.getItem("dpub")) || {} }catch{ return {} } };
const b64 = t => { const a = new TextEncoder().encode(t); let r = ""; for(let i=0; i<a.length; i+=8192) r += String.fromCharCode(...a.subarray(i,i+8192)); return btoa(r); };
async function publish(obj){               // อัปเดต config.json ใน GitHub (คืน false ถ้ายังไม่ได้ตั้งค่า)
  const c = PUB(); if(!c.repo || !c.token) return false;
  const u = `https://api.github.com/repos/${c.repo}/contents/config.json`, br = c.branch || "main";
  const H = {Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json"};
  const g = await fetch(u+"?ref="+encodeURIComponent(br),{headers:H});
  if(g.status!=404 && !g.ok) throw new Error(g.status==401||g.status==403 ? "token ไม่ถูกต้องหรือไม่มีสิทธิ์" : "HTTP "+g.status);
  const r = await fetch(u,{method:"PUT",headers:H,body:JSON.stringify({message:"update config from admin", content:b64(JSON.stringify(obj,null,1)), branch:br, sha:g.ok ? (await g.json()).sha : undefined})});
  if(!r.ok) throw new Error(r.status==404 ? "ไม่พบ repo/branch" : r.status==401||r.status==403 ? "token ไม่ถูกต้องหรือไม่มีสิทธิ์" : "HTTP "+r.status);
  return true;
}

document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn,.side button"); if(!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width,r.height)*2, s = document.createElement("span");
  s.className = "rip"; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 650);
  if((b.dataset.tab || b.dataset.go) && !matchMedia("(prefers-reduced-motion:reduce)").matches)
    for(let i=0; i<6; i++){
      const p = document.createElement("span"), a = Math.random()*Math.PI*2, r2 = 40+Math.random()*50;
      p.className = "burst"; p.textContent = ["💎","✨","💗","⭐"][i%4]; p.style.left = e.clientX+"px"; p.style.top = e.clientY+"px";
      p.style.setProperty("--bx", Math.cos(a)*r2+"px"); p.style.setProperty("--by", Math.sin(a)*r2-20+"px"); p.style.setProperty("--br", (Math.random()*360-180)+"deg");
      document.body.appendChild(p); setTimeout(() => p.remove(), 850);
    }
});
